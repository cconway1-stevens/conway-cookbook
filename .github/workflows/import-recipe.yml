name: Import recipe from URL
on:
  workflow_dispatch:
    inputs:
      recipe_url:
        description: Public HTTPS recipe URL
        required: true
        type: string
      category:
        description: Cookbook course
        required: true
        type: choice
        default: Mains
        options:
          - Breakfast
          - Appetizers
          - Soups & Salads
          - Mains
          - Sides
          - Breads
          - Desserts
          - Drinks
      permission_to_share:
        description: I wrote this recipe or have permission to share it publicly
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  extract:
    name: Extract and validate recipe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      file: ${{ steps.recipe.outputs.file }}
    steps:
      - name: Check import prerequisites
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PERMISSION_TO_SHARE: ${{ inputs.permission_to_share }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" || "$GITHUB_REF_TYPE" != branch ]]; then
            echo "::error::Run this workflow from the default branch."
            exit 1
          fi
          if [[ "$PERMISSION_TO_SHARE" != true ]]; then
            echo "::error::Confirm you have permission to share the recipe before importing."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Extract recipe data
        id: recipe
        env:
          RECIPE_URL: ${{ inputs.recipe_url }}
          RECIPE_CATEGORY: ${{ inputs.category }}
        run: |
          path=$(python3 scripts/import-recipe.py --url "$RECIPE_URL" --category "$RECIPE_CATEGORY")
          [[ "$path" =~ ^src/content/recipes/[a-z0-9-]+\.json$ && -f "$path" ]]
          echo "file=${path##*/}" >> "$GITHUB_OUTPUT"
      - run: npm ci --omit=dev
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cookbook-draft-${{ github.run_attempt }}
          path: src/content/recipes/${{ steps.recipe.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: extract
    uses: ./.github/workflows/create-review-branch.yml
    permissions:
      contents: write
    with:
      kind: recipes
      file: ${{ needs.extract.outputs.file }}
