name: Deploy cookbook to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      # Record the read-aloud voice. If this fails, the site still deploys and
      # cook mode reads with a voice on the visitor's device instead.
      - uses: actions/cache@v4
        with:
          path: public/audio
          key: narration-${{ hashFiles('src/content/recipes/**', 'src/lib/narration.mjs', 'src/data/cookbook.json') }}
          restore-keys: narration-
      - name: Record recipe narration
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm run narrate
      - run: npm run build
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
