name: Deploy cookbook to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      # Record the read-aloud voice. All of it may fail without stopping the deploy:
      # cook mode then reads with a voice on the visitor's device instead.
      - uses: actions/cache/restore@v4
        id: voice
        continue-on-error: true
        with:
          path: public/audio
          key: narration-${{ hashFiles('src/content/recipes/**', 'src/lib/narration.mjs', 'src/data/cookbook.json') }}
          restore-keys: narration-
      - name: Record recipe narration
        continue-on-error: true
        timeout-minutes: 20
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npm run narrate
      - uses: actions/cache/save@v4
        if: steps.voice.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: public/audio
          key: ${{ steps.voice.outputs.cache-primary-key }}
      # The site itself never installs the voice tools.
      - run: npm ci --omit=dev
      - run: npm run build
        env:
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME"               --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become visible after upload"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
